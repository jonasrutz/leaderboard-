version: "3.8"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  api:
    image: leaderboard-api:1.0
    environment:
      - REDIS_HOST=redis
    ports:
      - "8080:5000"
    networks:
      - backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  worker:
    image: leaderboard-worker:1.0
    environment:
      - REDIS_HOST=redis
    networks:
      - backend
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

networks:
  backend:
    driver: overlay

volumes:
  redis-data:
